name: Verificação Android
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lista-de-casa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
  screenshot:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lista-de-casa-apk
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o aplicativo no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install app-release.apk
            adb shell am start -n br.com.felipemadison.compras/.MainActivity
            sleep 15
            adb shell screencap -p /sdcard/lista-de-casa.png
            adb pull /sdcard/lista-de-casa.png lista-de-casa.png
      - uses: actions/upload-artifact@v4
        with:
          name: captura-android
          path: lista-de-casa.png
